[project]
name = "supply-chain-blast-radius"
version = "0.1.0"
description = "An agent that traces npm supply-chain compromises through a FalkorDB dependency graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "falkordb>=1.8",
  "mcp>=2.3",
  "httpx>=0.27",
  "semantic-version>=2.10",
  "python-dotenv>=1.0",
  "anthropic>=1.15",
  "fastapi>=0.140",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Embedded FalkorDB for local dev without Docker (Python 3.12+).
lite = ["falkordblite>=0.10; python_version >= '3.12'"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
blast-ingest = "blastradius.ingest:main"
blast-mcp = "blastradius.mcp_server:main"
blast-web = "blastradius.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blastradius"]
