# Render Blueprint (free tier): Dashboard > New > Blueprint > pick this repo.
# Values marked `sync: false` are asked for once, in the dashboard; they never live in git.
services:
  - type: web
    name: hijack-radar
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Model: GROQ_API_KEY (free tier). To use Claude instead, add ANTHROPIC_API_KEY and
      # LLM_PROVIDER=anthropic in the dashboard, and raise the limits below.
      - key: GROQ_API_KEY
        sync: false
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        value: falkordb
      - key: FALKORDB_PASSWORD
        sync: false
      # Sized for Groq's free tier (roughly 200k tokens a day, a few thousand per question).
      - key: RATE_LIMIT_PER_VISITOR
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "600"
      - key: DAILY_QUESTION_LIMIT
        value: "25"
